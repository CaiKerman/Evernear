<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
<title>伴语 · 快捷输入</title><link rel="stylesheet" href="quick.css"></head><body>
<section id="result-panel" hidden><header><span id="result-label">译文</span><span><button id="speak" disabled>播放</button><button id="audio-stop" hidden>停止/取消录入</button><button id="copy" disabled>复制</button><button id="collapse" aria-label="收起结果">收起</button></span></header><pre id="result" aria-live="polite"></pre><p id="timing"></p></section>
<main><div class="toolbar"><span class="grip" title="拖动快捷栏">伴语</span><select id="preset" aria-label="使用预设"><option value="translate">中英互译</option><option value="polish">英文润色</option><option value="answer">简短问答</option></select><label><input id="context" type="checkbox">上下文</label><button id="clear" title="清空局部会话，保留当前结果">清空</button><span class="spacer"></span><button id="settings" aria-label="快捷栏设置">设置</button><button id="hide" aria-label="隐藏快捷栏">×</button></div>
<form id="quick-form"><textarea id="input" rows="1" placeholder="输入中文或英文，回车翻译…" aria-label="快捷输入" spellcheck="false"></textarea><button id="record" type="button">录入</button><button id="record-cancel" type="button" hidden>取消录入</button><button id="send" type="submit">发送</button><button id="cancel" type="button" hidden>取消</button></form>
<p id="audio-status" role="status"></p><p id="status" role="status">仅文字 · 右键进入设置</p></main><script type="module" src="../quick-renderer.js"></script></body></html>
